name: CI

# The rule engine (unity/KeplerDrift/Assets/KeplerDrift/Core) compiles without Unity and is checked by the MissionBot scenarios.
# Why not the Unity Editor here: license + ~30 min first compile on every PR eats the quota; the rules are plain C# anyway.
# The Unity side is compiled in unity-screenshots.yml (screens/** branches) and ios-testflight.yml (main).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-mcs mono-runtime > /dev/null
      # If Core imports UnityEngine this step fails: the rule layer must stay testable without Unity.
      - name: No UnityEngine in Core
        run: |
          if grep -RIn --include='*.cs' -E '^\s*using\s+UnityEngine' unity/KeplerDrift/Assets/KeplerDrift/Core; then
            echo "::error::Core imports UnityEngine"; exit 1
          fi
      - name: Compile Core + MissionBot
        run: mcs -warnaserror+ -out:"$RUNNER_TEMP/missionbot.exe" tool/unity_test/MissionBot.cs unity/KeplerDrift/Assets/KeplerDrift/Core/*.cs
      - name: Run MissionBot
        run: mono "$RUNNER_TEMP/missionbot.exe"
